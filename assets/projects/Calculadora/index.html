<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">
  <div class="screen">

<div class="topo">
  <button class="theme-btn" onclick="toggleTheme()">☀️/🌙</button>
</div>

<input type="text" id="visor" disabled>

<div class="grid">
  <button onclick="clean()">C</button>
  <button onclick="add('(')">(</button>
  <button onclick="add(')')">)</button>
  <button onclick="add('/')" class="op">÷</button>

  <button onclick="add(7)">7</button>
  <button onclick="add(8)">8</button>
  <button onclick="add(9)">9</button>
  <button onclick="add('*')" class="op">×</button>

  <button onclick="add(4)">4</button>
  <button onclick="add(5)">5</button>
  <button onclick="add(6)">6</button>
  <button onclick="add('-')" class="op">−</button>

  <button onclick="add(1)">1</button>
  <button onclick="add(2)">2</button>
  <button onclick="add(3)">3</button>
  <button onclick="add('+')" class="op">+</button>

  <button onclick="add(0)">0</button>
  <button onclick="add('.')">.</button>
  <button onclick="calculate()" class="igual">=</button>
</div>


  </div>
</div>

<script src="script.js"></script>

</body>
</html>
